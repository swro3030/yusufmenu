<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
</head>

<body>

<h2>Admin Panel</h2>

<input id="pass" placeholder="Şifre">
<button onclick="login()">Giriş</button>

<div id="panel" style="display:none">

<input id="name" placeholder="Ürün"><br>
<input id="price" placeholder="Fiyat"><br>
<input id="category" placeholder="Kategori"><br>
<input type="file" id="file"><br><br>

<button onclick="add()">Ekle</button>

<hr>

<div id="list"></div>

</div>

<script type="module">
import { db, storage } from "./firebase.js";
import { collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

window.login = function(){
  if(pass.value=="1234"){
    panel.style.display="block";
  }
}

async function upload(file){
  const r = ref(storage,"menu/"+file.name);
  await uploadBytes(r,file);
  return await getDownloadURL(r);
}

window.add = async function(){
  const file = document.getElementById("file").files[0];
  const url = await upload(file);

  await addDoc(collection(db,"menu"),{
    name: name.value,
    price: price.value,
    category: category.value,
    img: url
  });
}

onSnapshot(collection(db,"menu"), (snap)=>{
  let html="";

  snap.forEach(d=>{
    let i=d.data();

    html+=`
    <div>
      ${i.name} - ${i.price}
      <button onclick="del('${d.id}')">Sil</button>
    </div>`;
  });

  list.innerHTML=html;
});

window.del = async function(id){
  await deleteDoc(doc(db,"menu",id));
}
</script>

</body>
</html>
