<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body { font-family: Arial; background: #eee; padding:20px; }
.box { background:white; padding:20px; border-radius:10px; }
input, button {
    width:100%;
    padding:10px;
    margin:5px 0;
}
button {
    background:#2e7d32;
    color:white;
    border:none;
}
.delete {
    background:red;
}
.hidden {
    display:none;
}
</style>
</head>

<body>

<div id="login" class="box">
<h3>Admin Giriş</h3>
<input type="password" id="pass" placeholder="Şifre">
<button onclick="login()">Giriş</button>
</div>

<div id="panel" class="box hidden">
<h3>Menü Yönetimi</h3>

<input id="name" placeholder="Ürün adı">
<input id="price" placeholder="Fiyat">
<input id="category" placeholder="Kategori (örn: İçecek)">
<input id="img" placeholder="Fotoğraf URL">
<button onclick="add()">Ekle</button>

<div id="list"></div>
</div>

<script>
let password = "1234";

function login(){
    if(document.getElementById("pass").value === password){
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").classList.remove("hidden");
        render();
    } else {
        alert("Hatalı şifre!");
    }
}

let data = JSON.parse(localStorage.getItem("menuData")) || [];

function save(){
    localStorage.setItem("menuData", JSON.stringify(data));
}

function add(){
    let item = {
        name: document.getElementById("name").value,
        price: document.getElementById("price").value,
        category: document.getElementById("category").value,
        img: document.getElementById("img").value
    };

    if(!item.name⠞⠵⠵⠺⠞⠟⠞⠟⠟⠟⠟⠺⠺⠵⠵!item.category){
        alert("Boş alan bırakma!");
        return;
    }

    data.push(item);
    save();
    render();
}

function del(i){
    data.splice(i,1);
    save();
    render();
}

function render(){
    let list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach((x,i)=>{
        list.innerHTML += `
        <div>
            ${x.name} - ${x.price}₺ (${x.category})
            <button class="delete" onclick="del(${i})">Sil</button>
        </div>`;
    });
}
</script>

</body>
</html>
