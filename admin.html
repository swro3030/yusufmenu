<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
</head>
<body>

<h2>Admin Giriş</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>

<h2>Menü Ekle</h2>
<input id="urun" placeholder="Ürün adı">
<input id="fiyat" placeholder="Fiyat">
<button onclick="ekle()">Ekle</button>

<!-- Firebase compat sürüm -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCjnQF7dIThwvtBj2e7P_RAXhOW9rnNwi4",
  authDomain: "menu-admin-89989.firebaseapp.com",
  databaseURL: "https://menu-admin-89989-default-rtdb.firebaseio.com",
  projectId: "menu-admin-89989",
  storageBucket: "menu-admin-89989.firebasestorage.app",
  messagingSenderId: "170146148103",
  appId: "1:170146148103:web:c651f61623cc7356d9dfa2",
  measurementId: "G-P71R72XQ13"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email, password)
  .then(() => alert("Giriş başarılı"))
  .catch(err => alert(err.message));
}

function ekle(){
  const urun = document.getElementById("urun").value;
  const fiyat = document.getElementById("fiyat").value;

  db.ref("menu").push({
    urun: urun,
    fiyat: fiyat
  }).then(() => alert("Eklendi"));
}
</script>

</body>
</html>
