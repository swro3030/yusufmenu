<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yusuf Çınar Altı Aile Bahçesi</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f4f4;
}
header {
    background: #2e7d32;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}
.category {
    margin: 15px;
    font-size: 18px;
    font-weight: bold;
}
.item {
    background: white;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
}
.item img {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
}
</style>
</head>

<body>

<header>Yusuf Çınar Altı Aile Bahçesi</header>

<div id="menu"></div>

<script>
let data = JSON.parse(localStorage.getItem("menuData")) || [];

function render(){
    let div = document.getElementById("menu");
    div.innerHTML = "";

    let categories = [...new Set(data.map(x => x.category))];

    categories.forEach(cat => {
        div.innerHTML += <div class="category">${cat}</div>;

        data.filter(x => x.category === cat).forEach(item => {
            div.innerHTML += `
            <div class="item">
                <img src="${item.img || 'https://via.placeholder.com/80'}">
                <div>
                    <b>${item.name}</b><br>
                    ${item.price}₺
                </div>
            </div>`;
        });
    });
}

render();
</script>

</body>
</html>
