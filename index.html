<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Yusuf Çınaraltı</title>

<style>
body{
  margin:0;
  background:#0b1d14;
  color:white;
  font-family:Arial;
}

.header img{
  width:100%;
  max-height:300px;
  object-fit:cover;
}

.menu{
  padding:20px;
}

.card{
  display:flex;
  background:#122b1f;
  margin:10px 0;
  padding:10px;
  border-radius:12px;
  align-items:center;
}

.card img{
  width:80px;
  height:80px;
  border-radius:10px;
  object-fit:cover;
}

.price{
  margin-left:auto;
  color:gold;
}

button{
  margin-left:10px;
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.jpg">
</div>

<div id="menu" class="menu"></div>

<center>
<button onclick="sendWhatsApp()">📱 Sipariş Ver</button>
</center>

<script type="module">
import { db } from "./firebase.js";
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let cart = [];

onSnapshot(collection(db,"menu"), (snap)=>{
  let html="";

  snap.forEach(doc=>{
    let i = doc.data();

    html += `
    <div class="card">
      <img src="${i.img}">
      <div>
        <b>${i.name}</b><br>
        ${i.category}
      </div>
      <div class="price">${i.price}₺</div>
      <button onclick='add(${JSON.stringify(i)})'>+</button>
    </div>`;
  });

  document.getElementById("menu").innerHTML = html;
});

window.add = function(i){
  cart.push(i);
  alert("Eklendi");
}

window.sendWhatsApp = function(){
  let text="Sipariş:\n";

  cart.forEach(i=>{
    text+= i.name+" "+i.price+"₺\n";
  });

  window.open("https://wa.me/905386270200?text="+encodeURIComponent(text));
}
</script>

</body>
</html>
